[project]
name = "meow-cli"
version = "0.1.0"
description = "Play an ASCII GIF in your terminal (meow)"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
  "Pillow>=9.0",
]

[project.scripts]
meow = "meow_cli.cli:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
meow_cli = ["silly-cat.gif"]
